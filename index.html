<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadi Batuk</title>
<style>
  :root {
    --nav-bg: #1f2a44;
    --nav-text: #f5f7fb;
    --nav-hover: #3a4a75;
    --nav-active: #f2b84b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; }

  /* ---------- Navbar (desktop: fully expanded) ---------- */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 24px;
    padding: 0 20px; height: 60px;
    background: var(--nav-bg); color: var(--nav-text);
  }
  .brand { font-weight: 700; font-size: 1.2rem; color: var(--nav-text); text-decoration: none; }

  .nav-links { display: flex; list-style: none; margin: 0; padding: 0; gap: 4px; }
  .nav-links a {
    display: block; padding: 10px 16px; border-radius: 6px;
    color: var(--nav-text); text-decoration: none;
  }
  .nav-links a:hover, .nav-links a:focus-visible { background: var(--nav-hover); }
  .nav-links a.active { color: var(--nav-active); font-weight: 600; }

  .menu-btn, .overlay { display: none; }

  /* ---------- Mobile / Android: folded, opens from the left ---------- */
  @media (max-width: 768px) {
    .menu-btn {
      display: block; order: -1;           /* button sits on the left */
      background: none; border: 0; color: var(--nav-text);
      font-size: 1.8rem; line-height: 1; padding: 6px 10px; cursor: pointer;
    }
    .nav-links {
      position: fixed; top: 0; left: 0;    /* drop-down panel on the LEFT */
      width: 260px; height: 100%;
      flex-direction: column; gap: 0; padding: 70px 12px 12px;
      background: var(--nav-bg);
      transform: translateX(-100%);
      transition: transform .25s ease;
      z-index: 200;
    }
    .nav-links.open { transform: translateX(0); }
    .nav-links a { padding: 14px 16px; }

    .overlay {
      display: block; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 150;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-links, .overlay { transition: none; }
  }
</style>    

</head>
<body>

<nav class="navbar" aria-label="Main navigation">
  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
  <a href="index.html" class="brand">My Website</a>

  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>
<div class="overlay" id="overlay"></div>

<script>
  const btn = document.getElementById('menuBtn');
  const links = document.getElementById('navLinks');
  const overlay = document.getElementById('overlay');

  function setMenu(open) {
    links.classList.toggle('open', open);
    overlay.classList.toggle('show', open);
    btn.setAttribute('aria-expanded', open);
    btn.innerHTML = open ? '&times;' : '&#9776;';
  }
  btn.addEventListener('click', () => setMenu(!links.classList.contains('open')));
  overlay.addEventListener('click', () => setMenu(false));
  links.addEventListener('click', e => { if (e.target.tagName === 'A') setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
</script>

    <div class="welcome-card">
        <h1>Batuk Ventures</h1>
        <p>Welcome to my brand new website. I'm excited to share my work and ideas with you.</p>
        <a href="contactus.html">Contact Us</a>
    </div>
<!-- The Footer Section -->
    <footer>
        <div class="footer-content">
            <p> Batuk Ventures 2025-26. All rights reserved.</p>
        </div>
    </footer>
    

</body>
</html>
